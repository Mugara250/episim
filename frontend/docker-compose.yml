services:
  frontend:
    build: .
    container_name: episim-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  frontend_node_modules:
